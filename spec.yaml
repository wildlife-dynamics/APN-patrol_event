    Event Style.properties.event_layer.properties.layer_style.properties.billboard.type: boolean
    Event Style.properties.event_layer.properties.layer_style.properties.billboard.default: false
    Event Style.properties.event_layer.properties.layer_style.properties.billboard.title: Billboard
    Event Style.properties.event_layer.properties.layer_style.properties.billboard.description: Always face the marker toward the camera regardless of map tilt.
    Event Style.properties.event_layer.properties.layer_style.properties.billboard.ecoscope:advanced: true
  # patrol (commented out for now):
  #   PathLayerStyle.properties.get_color.default: column_color
  #   PathLayerStyle.properties.get_color.title: Color
  #   PathLayerStyle.properties.get_color.description: Column used for track color. Defaults to the colormap output.
  #   PathLayerStyle.properties.get_width.title: Line Width
  #   PathLayerStyle.properties.get_width.description: Width of the patrol track line.
  #   PathLayerStyle.properties.get_width.anyOf:
  #     - type: integer
  #   PathLayerStyle.properties.width_units.description: "Unit for line width — pixels (screen-space) or meters (world-space)."
  #   PathLayerStyle.properties.width_min_pixels.title: Min Width (px)
  #   PathLayerStyle.properties.width_min_pixels.description: Minimum line width in pixels regardless of zoom level.
  #   PathLayerStyle.properties.cap_rounded.title: Rounded Caps
  #   PathLayerStyle.properties.cap_rounded.description: Draw rounded ends on each track segment.
  #   PathLayerStyle.properties.opacity.description: "Layer opacity from 0 (transparent) to 1 (opaque)."
  #   PathLayerStyle.properties.width_scale.description: Global multiplier applied to all line widths.
  #   PathLayerStyle.properties.joint_rounded.title: Rounded Joints
  #   PathLayerStyle.properties.joint_rounded.description: Draw rounded joins between path segments.
  #   PathLayerStyle.properties.billboard.description: Render the path always facing the camera.
  #   PathLayerStyle.properties.wireframe.description: Render the path as a wireframe.
  #   PathLayerStyle.properties.auto_highlight.description: Highlight the layer on hover.
  #   PathLayerStyle.properties.pickable.description: Allow the layer to respond to pointer events.
  #   ScatterplotLayerStyle.properties.get_fill_color.default: column_color
  #   ScatterplotLayerStyle.properties.get_fill_color.title: Fill Color
  #   ScatterplotLayerStyle.properties.get_fill_color.description: Column used for marker fill color. Defaults to the colormap output.
  #   ScatterplotLayerStyle.properties.get_radius.title: Radius
  #   ScatterplotLayerStyle.properties.get_radius.description: Size of each event marker.
  #   ScatterplotLayerStyle.properties.get_radius.anyOf:
  #     - type: integer
  #   ScatterplotLayerStyle.properties.get_line_width.title: Outline Width
  #   ScatterplotLayerStyle.properties.get_line_width.description: Width of the marker outline when Show Outline is enabled.
  #   ScatterplotLayerStyle.properties.get_line_width.anyOf:
  #     - type: integer
  #   ScatterplotLayerStyle.properties.get_elevation.title: Elevation
  #   ScatterplotLayerStyle.properties.get_elevation.description: Height of each marker for 3D visualisation.
  #   ScatterplotLayerStyle.properties.get_elevation.anyOf:
  #     - type: integer
  #   ScatterplotLayerStyle.properties.get_elevation.default: 0
  #   ScatterplotLayerStyle.properties.radius_units.description: "Unit for radius — pixels (screen-space) or meters (world-space)."
  #   ScatterplotLayerStyle.properties.radius_min_pixels.title: Min Radius (px)
  #   ScatterplotLayerStyle.properties.radius_min_pixels.description: Minimum marker radius in pixels regardless of zoom level.
  #   ScatterplotLayerStyle.properties.stroked.title: Show Outline
  #   ScatterplotLayerStyle.properties.stroked.description: Draw an outline around each marker.
  #   ScatterplotLayerStyle.properties.opacity.description: "Layer opacity from 0 (transparent) to 1 (opaque)."
  #   ScatterplotLayerStyle.properties.filled.description: Fill the markers with color.
  #   ScatterplotLayerStyle.properties.radius_scale.description: Global multiplier applied to all marker radii.
  #   ScatterplotLayerStyle.properties.line_width_units.title: Outline Width Units
  #   ScatterplotLayerStyle.properties.line_width_units.description: "Unit for outline width — pixels (screen-space) or meters (world-space)."
  #   ScatterplotLayerStyle.properties.line_width_scale.title: Outline Width Scale
  #   ScatterplotLayerStyle.properties.line_width_scale.description: Global multiplier applied to all outline widths.
  #   ScatterplotLayerStyle.properties.line_width_min_pixels.title: Min Outline Width (px)
  #   ScatterplotLayerStyle.properties.line_width_min_pixels.description: Minimum outline width in pixels regardless of zoom level.
  #   ScatterplotLayerStyle.properties.elevation_scale.title: Elevation Scale
  #   ScatterplotLayerStyle.properties.elevation_scale.description: Global multiplier for marker elevation.
  #   ScatterplotLayerStyle.properties.billboard.description: Render markers always facing the camera.
  #   ScatterplotLayerStyle.properties.auto_highlight.description: Highlight the layer on hover.
  #   ScatterplotLayerStyle.properties.pickable.description: Allow the layer to respond to pointer events.
  $defs:
    EarthRangerSource:
      title: EarthRanger
      type: object
      properties:
        query:
          title: Query
          default: null
          anyOf:
            - type: "null"
              title: "--- select ---"
            - $ref: "#/$defs/FeatureSetQuery"
            - $ref: "#/$defs/FeatureTypeQuery"
            - $ref: "#/$defs/FeatureIdQuery"
  uiSchema:
    Spatial Features.spatial_features.source:
      ui:options:
        label: false
    Spatial Features.spatial_features.source.query:
      ui:options:
        label: false
    Spatial Features.spatial_features.source.query.anyOf:
      - ui:options:
          label: false
      - ui:options:
          label: false
      - ui:options:
          label: false
    Spatial Features.spatial_features.legend_title:
      ui:placeholder: "e.g. Park Boundary"
    Event Style.event_layer.layer_style.get_fill_color:
      ui:widget: hidden
    Event Style.event_layer.layer_style.get_line_color:
      ui:widget: hidden
    Event Style.event_layer.layer_style.get_position:
      ui:widget: hidden
    Patrol Style.patrol_tracks_layer.layer_style.get_color:
      ui:widget: hidden
    Patrol Style.patrol_tracks_layer.layer_style.get_path:
      ui:widget: hidden
    # "Patrol Style.patrol_tracks_layer.layer_style.get_width":
    #   ui:widget: updown
    # "Event Style.event_layer.layer_style.get_radius":
    #   ui:widget: updown
    # "Event Style.event_layer.layer_style.get_line_width":
    #   ui:widget: updown
    # "Event Style.event_layer.layer_style.get_elevation":
    #   ui:widget: hidden
    # Patrol Style.ui:order:
    #   - patrol_colormap
    #   - patrol_legend_title
    #   - patrol_tracks_layer
    # Event Style.ui:order:
    #   - event_colormap
    #   - event_legend_title
    #   - event_layer

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  - name: Set Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Data Source
    id: er_client
    task: set_er_connection

  - id: user_details
    task: get_user_me
    partial:
      client: ${{ workflow.er_client.return }}

  - name: Define Base Maps
    id: base_maps
    task: set_base_maps

  - name: Set Locale
    id: locale
    task: set_locale
    partial:
      locale_str: es_ES

  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: "%d %b %Y %H:%M:%S"

  - name: Extract Timezone Selection
    id: get_timezone
    task: get_timezone_from_time_range
    partial:
      time_range: ${{ workflow.time_range.return }}

  - name: Specify Outing ID
    id: outing_id
    task: set_string_var

  - name: Get Report Template Path
    id: get_template_path
    task: set_string_var

  - name: Get Events
    id: events
    task: get_events
    partial:
      client: ${{ workflow.er_client.return }}
      time_range: ${{ workflow.time_range.return }}
      event_columns:
        - id
        - time
        - event_type
        - serial_number
        - event_details
        - event_category
        - geometry
        - patrol_segments
      event_types: []
      include_details: true
      raise_on_empty: false
      include_updates: false
      include_display_values: true
      include_related_events: false
      include_null_geometry: false

  - id: convert_events_to_user_tz
    task: convert_values_to_timezone
    partial:
      df: ${{ workflow.events.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns:
        - time

  - name: Filter Patrol information by Outing ID
    id: patrol_info_extraction
    task: extract_using_str_accessor
    partial:
      df: ${{ workflow.convert_events_to_user_tz.return }}
      column_name: event_details
      key: numero_patrulla
      value: ${{ workflow.outing_id.return }}

  # explode patrol_segemnts of events to its individual rows
  - name: Explode Patrol Info
    id: explode_patrol_info
    task: explode
    partial:
      df: ${{ workflow.patrol_info_extraction.return }}
      column_name: "patrol_segments"
      ignore_index: false

  # Get list of patrol_segments
  - name: Get Patrol Segments IDs
    id: segment_ids
    task: to_list
    partial:
      df: ${{ workflow.explode_patrol_info.return }}
      column_name: patrol_segments

  - title: Patrol and Event Types
    type: task-group
    description: ""
    tasks:
      - id: patrol_and_events_params
        task: set_patrols_and_patrol_events_params
        partial:
          client: ${{ workflow.er_client.return }}
          time_range: ${{ workflow.time_range.return }}
          patrol_types: []
          event_types: []
          sub_page_size: 100
          raise_on_empty: false
          include_patrol_details: true
          truncate_to_time_range: true
          include_null_geometry: false

      - id: prefetch_patrols
        task: get_patrols_from_combined_params
        partial:
          combined_params: ${{ workflow.patrol_and_events_params.return }}

      - id: patrol_observations
        task: get_patrol_observations_from_patrols_df_and_combined_params
        partial:
          patrols_df: ${{ workflow.prefetch_patrols.return }}
          combined_params: ${{ workflow.patrol_and_events_params.return }}

      - id: convert_patrols_to_user_timezone
        task: convert_values_to_timezone
        partial:
          df: ${{ workflow.patrol_observations.return }}
          timezone: ${{ workflow.get_timezone.return }}
          columns:
            - patrol_start_time
            - patrol_end_time
            - fixtime

      - id: patrol_events
        task: unpack_events_from_patrols_df_and_combined_params
        partial:
          patrols_df: ${{ workflow.prefetch_patrols.return }}
          combined_params: ${{ workflow.patrol_and_events_params.return }}

      - id: convert_events_to_user_timezone
        task: convert_values_to_timezone
        partial:
          df: ${{ workflow.patrol_events.return }}
          timezone: ${{ workflow.get_timezone.return }}
          columns:
            - time
            - patrol_start_time

      # filter patrol events with patrol_segments_ids[found]
      - name: Filterby Segment IDs
        id: patrol_events_f
        task: filter_row_values
        partial:
          df: ${{ workflow.convert_events_to_user_timezone.return }}
          column: "patrol_segment_id"
          values: ${{ workflow.segment_ids.return }}

      # filter patrol observations with patrol_id[found]
      - name: Get Patrol IDs
        id: patrol_ids
        task: to_list
        partial:
          df: ${{ workflow.patrol_events_f.return }}
          column_name: patrol_id

      - name: Filterby Segment IDs
        id: patrol_observations_f
        task: filter_row_values
        partial:
          df: ${{ workflow.convert_patrols_to_user_timezone.return }}
          column: "patrol_id"
          values: ${{ workflow.patrol_ids.return }}

  - title: ""
    type: task-group
    description: ""
    tasks:
      - name: Transform Observations to Relocations
        id: patrol_relocations
        task: process_relocations
        partial:
          observations: ${{ workflow.patrol_observations_f.return }}
          relocs_columns:
            - patrol_id
            - patrol_start_time
            - patrol_end_time
            - patrol_type__display
            - patrol_serial_number
            - groupby_col
            - fixtime
            - junk_status
            - geometry

          filter_point_coords:
            - x: 180.000000
              y: 90.000000
            - x: 0.000000
              y: 0.000000
            - x: 1.000000
              y: 1.000000

      - name: Patrol Trajectory
        id: patrol_trajectory
        task: relocations_to_trajectory
        partial:
          relocations: ${{ workflow.patrol_relocations.return }}

  - title: Trajectory Statistics
    type: task-group
    description: ""
    tasks:
      - id: trajectory_stats
        task: summarize_df
        partial:
          df: ${{ workflow.patrol_trajectory.return }}
          groupby_cols:
            - extra__patrol_serial_number
          reset_index: true
          summary_params:
            - display_name: "Tipo de Transporte"
              aggregator: unique
              column: extra__patrol_type__display
              decimal_places: null
            - display_name: Inicio
              aggregator: min
              column: extra__patrol_start_time
              decimal_places: null
            - display_name: Fin
              aggregator: max
              column: extra__patrol_end_time
              decimal_places: null
            - display_name: "Distancia Total (km)"
              aggregator: sum
              column: dist_meters
              original_unit: m
              new_unit: km
              decimal_places: 2
            - display_name: "Horas Totales (hr)"
              aggregator: sum
              column: timespan_seconds
              original_unit: s
              new_unit: h
              decimal_places: 2

      - id: renamed_trajectory_stats
        task: map_columns
        partial:
          df: ${{ workflow.trajectory_stats.return }}
          raise_if_not_found: True
          rename_columns:
            extra__patrol_serial_number: ID de Patrulla
          retain_columns: null
          drop_columns: null

      - id: trajectory_stats_table
        task: draw_table
        partial:
          dataframe: ${{ workflow.renamed_trajectory_stats.return }}

      - id: trajectory_stats_table_html
        task: persist_text
        partial:
          text: ${{ workflow.trajectory_stats_table.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: trajectory_stats_table

      - id: trajectory_stats_table_sv
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Resumen de Patrullas"
          data: ${{ workflow.trajectory_stats_table_html.return }}

  - title: Patrol Summary Statistics Cards
    type: task-group
    description: "Create single value widgets for various patrol statistics."
    tasks:
      # Widget: Nro. de Patrullajes realizadas
      - name: Calculate total Patrols
        id: total_patrols
        task: dataframe_column_nunique
        partial:
          df: ${{ workflow.patrol_trajectory.return }}
          column_name: extra__patrol_id

      - name: Create Single Value Widget for total Patrols
        id: total_patrols_sv
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Nro. de Patrullajes realizadas"
          decimal_places: 0
          data: ${{ workflow.total_patrols.return }}

      # Widget: Nro. de Kilómetros recorridos
      - name: Calculate Total Distance
        id: total_distance
        task: dataframe_column_sum
        partial:
          df: ${{ workflow.patrol_trajectory.return }}
          column_name: dist_meters

      - name: Convert total distance units
        id: total_distance_km
        task: with_unit
        partial:
          original_unit: m
          new_unit: km
          value: ${{ workflow.total_distance.return }}

      - name: Create Single Value Widget for Total Distance
        id: total_distance_sv
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Nro. de Kilómetros recorridos"
          decimal_places: 2
          data: ${{ workflow.total_distance_km.return }}

  - title: Process Event Details
    type: task-group
    description: ""
    tasks:
      - id: events_ids
        task: to_list
        partial:
          df: ${{ workflow.patrol_events_f.return }}
          column_name: id

      - id: events_details
        task: filter_row_values
        partial:
          df: ${{ workflow.convert_events_to_user_tz.return }}
          column: id
          values: ${{ workflow.events_ids.return }}

      - id: processed_events_details
        task: process_events_details
        partial:
          df: ${{ workflow.events_details.return }}
          client: ${{ workflow.er_client.return }}
          map_to_titles: true
          ordered: true

      - id: event_categories
        task: get_event_categories
        partial:
          client: ${{ workflow.er_client.return }}

      - id: mapped_events
        task: map_event_category_display
        partial:
          events_df: ${{ workflow.processed_events_details.return }}
          categories_df: ${{ workflow.event_categories.return }}

      - id: events_with_lat_lon
        task: add_lat_lon_to_gdf
        partial:
          event_gdf: ${{ workflow.mapped_events.return }}

      - id: patrol_info
        task: get_patrol_info
        partial:
          df: ${{ workflow.processed_events_details.return }}

      # --- Event Notes ---
      - id: event_notes
        task: get_eventnotes
        partial:
          event: ${{ workflow.events_with_lat_lon.return }}
          client: ${{ workflow.er_client.return }}
          use_index_as_id: false

      - id: event_subset
        task: select_columns
        partial:
          df: ${{ workflow.events_with_lat_lon.return }}
          raise_on_missing: false
          columns:
            - id
            - serial_number
            - event_type_display

      - id: eventnotes_add_event_serial_no
        task: merge_two_dataframes
        partial:
          left: ${{ workflow.event_notes.return }}
          right: ${{ workflow.event_subset.return }}
          on: null
          how: "left"
          left_on: event
          right_on: id
          left_index: False
          right_index: False
          fillna_value: null

      - id: safe_notes
        task: ensure_dataframe
        skipif:
          conditions:
            - never
        partial:
          df: ${{ workflow.eventnotes_add_event_serial_no.return }}

      - id: event_notes_subset
        task: select_columns
        partial:
          df: ${{ workflow.safe_notes.return }}
          raise_on_missing: false
          columns:
            - serial_number
            - text

      - id: events_and_notes
        task: merge_two_dataframes
        partial:
          left: ${{ workflow.events_with_lat_lon.return }}
          right: ${{ workflow.event_notes_subset.return }}
          on: "serial_number"
          how: "left"
          left_on: null
          right_on: null
          left_index: false
          right_index: false
          fillna_value: ""

      - id: safe_events_and_notes
        task: fill_skipsentinel
        skipif:
          conditions:
            - never
        partial:
          df: ${{ workflow.events_and_notes.return }}
          default: ${{ workflow.events_with_lat_lon.return }}

      - id: report_context
        task: prepare_patrol_report_context
        partial:
          df: ${{ workflow.safe_events_and_notes.return }}
          patrol_info: ${{ workflow.patrol_info.return }}

  - title: Spatial Features
    type: task-group
    description: "Fetch spatial features from EarthRanger and render them as a map layer."
    tasks:
      - id: spatial_features
        task: get_spatial_features
        partial:
          client: ${{ workflow.er_client.return }}

      - id: spatial_features_layer
        task: create_spatial_features_layer
        partial:
          geodataframe: ${{ workflow.spatial_features.return }}
          tooltip_columns: []

  - title: Local Spatial Features
    type: task-group
    description: "Load spatial features from a local file and render them as a map layer."
    tasks:
      - id: local_spatial_file
        task: load_local_spatial_file

      - id: local_spatial_features_layer
        task: create_spatial_features_layer
        partial:
          geodataframe: ${{ workflow.local_spatial_file.return }}
          tooltip_columns: []

  - title: Patrol Style
    type: task-group
    description: ""
    tasks:
      - id: patrol_colormap
        task: apply_qualitative_color_map
        partial:
          df: ${{ workflow.patrol_trajectory.return }}

      - id: patrol_legend_title
        task: set_string_var

      - id: patrol_tracks_layer
        task: create_path_layer
        partial:
          geodataframe: ${{ workflow.patrol_colormap.return }}
          legend:
            title: ${{ workflow.patrol_legend_title.return }}
            label_column: column_label
            color_column: column_color
          data_url: null

  - title: Patrol Markers
    type: task-group
    description: "Configure the appearance of patrol start and end point markers on the map."
    tasks:
      - id: patrol_endpoint_layers
        task: create_patrol_endpoint_layers
        partial:
          trajectory: ${{ workflow.patrol_colormap.return }}

  - title: Event Style
    type: task-group
    description: ""
    tasks:
      - id: event_colormap
        task: apply_qualitative_color_map
        partial:
          df: ${{ workflow.mapped_events.return }}

      - id: event_legend_title
        task: set_string_var

      - id: event_layer
        task: create_scatterplot_layer
        partial:
          geodataframe: ${{ workflow.event_colormap.return }}
          legend:
            title: ${{ workflow.event_legend_title.return }}
            label_column: column_label
            color_column: column_color
          data_url: null

      - id: optional_geo_layers
        task: collect_optional_layers
        skipif:
          conditions:
            - never
        partial:
          layers:
            - ${{ workflow.spatial_features_layer.return }}
            - ${{ workflow.local_spatial_features_layer.return }}
            - ${{ workflow.patrol_tracks_layer.return }}
            - ${{ workflow.patrol_endpoint_layers.return }}
            - ${{ workflow.event_layer.return }}

      - id: patrol_event_view_state
        task: view_state_from_layers
        partial:
          layers:
            - ${{ workflow.patrol_tracks_layer.return }}
            - ${{ workflow.event_layer.return }}
          max_zoom: 20

      - name: Draw Patrol + Event Map
        id: patrol_event_map
        task: draw_map
        partial:
          geo_layers: ${{ workflow.optional_geo_layers.return }}
          tile_layers: ${{ workflow.base_maps.return }}
          view_state: ${{ workflow.patrol_event_view_state.return }}
          output_type: html
          static: false
          title: null
          max_zoom: 17
          legend_style:
            placement: bottom-right

      - id: patrol_event_map_fullscreen
        task: add_fullscreen_to_map
        partial:
          html: ${{ workflow.patrol_event_map.return }}

      - name: Persist Patrol Tracks Map
        id: persist_patrol_map
        task: persist_text
        partial:
          text: ${{ workflow.patrol_event_map_fullscreen.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: null

      - name: Convert Patrol Tracks Map to PNG
        id: patrol_event_map_to_png
        task: html_to_png
        partial:
          html_path: ${{ workflow.persist_patrol_map.return }}
          output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          config:
            full_page: false

      - name: Create Map Widget for Event Map
        id: patrol_event_map_widget
        task: create_map_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Mapa de Patrulla y Eventos"
          data: ${{ workflow.persist_patrol_map.return }}

  # Events Attachments
  - name: Download Attachments
    id: download_attachments
    task: download_event_attachments
    partial:
      client: ${{ workflow.er_client.return }}
      event_gdf: ${{ workflow.event_colormap.return }}
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      use_index_as_id: false

  - id: norm_template_path
    task: remove_file_scheme
    partial:
      path: ${{ workflow.get_template_path.return }}

  - id: norm_output_dir
    task: remove_file_scheme
    partial:
      path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}

  - title: Patrol & Events Report
    type: task-group
    description: ""
    tasks:
      - id: generate_word_doc
        task: generate_patrol_report
        partial:
          total_distance: ${{ workflow.total_distance_km.return}}
          outing_id: ${{ workflow.outing_id.return }}
          context: ${{ workflow.report_context.return }}
          trajs: ${{ workflow.patrol_trajectory.return }}
          trajs_stats: ${{workflow.renamed_trajectory_stats.return }}
          events: ${{ workflow.event_colormap.return }}
          notes: [] #${{ workflow.safe_notes.return }}
          user_details: ${{ workflow.user_details.return }}
          attachments: ${{ workflow.download_attachments.return }}
          template_path: ${{ workflow.norm_template_path.return }}
          output_dir: ${{ workflow.norm_output_dir.return }}
          mapa: ${{ workflow.patrol_event_map_to_png.return }}

  - name: Create Dashboard
    id: dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      widgets:
        - ${{ workflow.total_patrols_sv.return }}
        - ${{ workflow.total_distance_sv.return }}
        - ${{ workflow.trajectory_stats_table_sv.return }}
        - ${{ workflow.patrol_event_map_widget.return }}
      time_range: ${{ workflow.time_range.return}}
