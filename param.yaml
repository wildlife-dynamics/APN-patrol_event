workflow_details:
  description: ""
  name: Patrol & Event Report
er_client:
  data_source:
    name: apncentral
time_range:
  timezone:
    label: America/Argentina/Buenos_Aires
    tzCode: ART
    name: Buenos Aires
    utc: "-03:00"
  since: "2026-11-01T00:00:00.000Z"
  until: "2026-11-18T23:59:00.000Z"
get_template_path:
  var: https://raw.githubusercontent.com/wildlife-dynamics/APN-patrol_event/main/resources/templates/apn_patrol_events_template.docx
patrol_id:
  var: "70"

patrol_colormap:
  input_column_name: extra__patrol_type__display
  colormap: Set1
  custom_colors: []
patrol_legend_title:
  var: Legend
event_colormap:
  input_column_name: event_type_display
  colormap: Set1
  custom_colors: []
event_legend_title:
  var: Legend
download_attachments:
  skip_download: true

# get_color/get_fill_color are hidden in the form (set by colormap); explicit here for make run
patrol_tracks_layer:
  layer_style:
    get_color: column_color

patrol_endpoint_layers:
  include_markers: false
  start_color: "#22c55e"
  end_color: "#ef4444"
  radius: 4
  legend_title: Patrol Markers

event_layer:
  layer_style:
    get_fill_color: column_color

spatial_features:
  source:
    query: null
      # by: feature_type
      # feature_type: "Parque Nacional y Reserva Nacional"
  group_by: title
  legend_title: "Parque Nacional y Reserva Nacional"
